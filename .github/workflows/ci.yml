name: CI

# The site auto-deploys on push, so a bump that breaks the build would ship a
# broken site. This is the gate in front of that.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      # `npm run lint` is deliberately not here yet: it reports six pre-existing
      # errors, one of them a real bug in the highlighter's tokenizer regex.
      # Add it to this job once those are fixed, rather than landing a gate that
      # is already red.
