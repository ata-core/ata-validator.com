version: 2
updates:
  # ata-validator moves faster than this repository does. A bump PR lands here
  # on its own so what this repository shows is never several versions behind
  # what is published.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    # ata's own packages travel together and only within a major version;
    # .github/workflows/merge-ata.yml merges this group once CI passes, so the
    # playground and the version the docs show follow each release by a day.
    groups:
      ata-releases:
        patterns:
          - "ata-validator"
          - "@ata-project/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
